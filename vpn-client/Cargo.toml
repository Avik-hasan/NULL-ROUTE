[package]
name = "vpn-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "vpn-client"
path = "src/main.rs"

[dependencies]
vpn-shared = { path = "../vpn-shared" }
vpn-core = { path = "../vpn-core" }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
arc-swap = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
ipnet = { workspace = true }

# Windows platform surface. Feature flags map 1:1 to the Win32 sub-APIs we call.
[target.'cfg(windows)'.dependencies]
widestring = { workspace = true }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",     # SetEntriesInAclW, BuildExplicitAccess
    "Win32_System_Memory",              # LocalAlloc/LocalFree
    "Win32_System_Threading",           # OpenProcessToken
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Rpc",
    "Win32_NetworkManagement_WindowsFilteringPlatform", # WFP (FWPM/FWP)
    "Win32_NetworkManagement_IpHelper",  # routing table, DNS iface binding
    "Win32_NetworkManagement_Ndis",      # MIB_IPPROTO_* route-origin constants
    "Win32_Networking_WinSock",
    "Win32_System_Console",              # SetConsoleCtrlHandler + CTRL_* events
    "Win32_System_RemoteDesktop",        # WTSQueryUserToken (interactive user SID)
]
